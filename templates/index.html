     templates/index.html - Main HTML Template
     ============================================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Auto-Tagger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 PDF Auto-Tagger</h1>
            <p>Add accessibility tags to your PDF documents</p>
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">Drop your PDF here or click to browse</div>
                    <div class="upload-hint">Maximum file size: 50MB</div>
                </div>
                <input type="file" id="fileInput" accept=".pdf">
            </div>

            <!-- Processing Section -->
            <div class="processing-section" id="processingSection">
                <div class="file-info">
                    <div class="file-name" id="fileName"></div>
                    <span class="status-badge" id="statusBadge">Processing</span>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="log-container" id="logContainer"></div>

                <div class="error-message" id="errorMessage"></div>

                <div class="button-group">
                    <button class="btn btn-primary" id="downloadBtn" disabled>
                        Download Tagged PDF
                    </button>
                    <button class="btn btn-secondary" id="newFileBtn">
                        Process Another File
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
