services:
  web:
    image: registry.gitlab.com/kgleason/fix-my-pdfs:latest
    ports:
      - "8880:8880"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - FLASK_ENV=production
    restart: unless-stopped
  cron-service:
    build:
      context: .
      dockerfile: cleanup.dockerfile
    restart: unless-stopped
