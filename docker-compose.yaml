# ============================================================================
# docker-compose.yml - Docker Compose (Optional)
# ============================================================================
version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - FLASK_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./tmp:/app/tmp
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
    depends_on:
      - web
    restart: unless-stopped